services:
    fpm: &fpm-container
        build:
            context: ./docker/local
            dockerfile: Dockerfile_fpm
        container_name: ${PROJECT_NAME}_fpm
        networks:
            - default
        volumes:
            - &app-src ./:/app
            - ./docker/local/config/fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf
            - ./docker/local/config/fpm/php.ini:/usr/local/etc/php/php.ini
            - ./docker/local/config/fpm/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            PHP_IDE_CONFIG: serverName=localhost
            REMOTE_HOST: host.docker.internal
            DB_DATABASE: &db-name ${DB_NAME}
            DB_USERNAME: &db-username ${DB_USER}
            DB_PASSWORD: &db-password ${DB_PASSWORD}
        depends_on:
            - database
            - redis

    nginx:
        build:
            context: ./docker/local
            dockerfile: Dockerfile_nginx
        container_name: ${PROJECT_NAME}
        environment:
            FASTCGI_PASS: ${PROJECT_NAME}_fpm:9000
        ports:
            - '30510:80'
        restart: unless-stopped
        volumes:
            - *app-src
            - ./docker/local/config/nginx/nginx.conf:/etc/nginx/nginx.conf
            - ./docker/local/config/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template
        networks:
            - default
        depends_on:
            - fpm

    go-parser:
        container_name: ${PROJECT_NAME}_parser
        build:
            context: docker/go-parser
        environment:
            - AI_SERVICE_URL=http://ai-service:8000
            - PHP_API_URL=http://nginx/api
        depends_on:
            - ai-service
        restart: unless-stopped

    database:
        container_name: ${PROJECT_NAME}_db
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        ports:
            - "3307:3306"
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
            interval: 5s
            retries: 10
        restart: unless-stopped

    ai-service:
        build:
            context: docker/ai-service
        env_file: py/.env
        ports: ["8000:8000"]
        volumes:
            - ./py/app:/app/app
        depends_on:
            redis:
                condition: service_healthy
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            retries: 5

    # Заготовка — раскомментируй, когда прикрутишь Kafka
    # zookeeper:
    #   image: confluentinc/cp-zookeeper:7.7.0
    #   environment:
    #     ZOOKEEPER_CLIENT_PORT: 2181
    #
    # kafka:
    #   image: confluentinc/cp-kafka:7.7.0
    #   depends_on: [zookeeper]
    #   ports: ["9092:9092"]
    #   environment:
    #     KAFKA_BROKER_ID: 1
    #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
    #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    #     KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
    db_data:
    redis_data:

networks:
    default:
