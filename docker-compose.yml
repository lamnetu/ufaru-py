services:
  giga-news-service:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # Монтируем только исходники, НЕ .venv
      - ./app:/app/app
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload