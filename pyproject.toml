# pyproject.toml
[project]
name = "giga-news-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "gigachat>=0.1.38",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "cachetools>=5.5",
    "redis>=5.2",
    "loguru>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
]
kafka = ["aiokafka>=0.11"]
