[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "giga-news-service"
version = "0.1.0"
description = "GigaChat News Rewriting Microservice"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
]

# Явно указываем, что пакетом является только папка app
[tool.hatch.build.targets.wheel]
packages = ["app"]